version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
      # Claude port (MCP and OAuth only) for `tailscale funnel`; on the host only, see CLAUDE-UND-TAILSCALE.md.
      - "127.0.0.1:5001:5001"
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:////app/data/trainhub.db
      - UPLOAD_FOLDER=/app/uploads
      # Created on first start next to the database; back it up separately from trainhub.db.
      - TRAINHUB_AI_ENCRYPTION_KEY_FILE=/app/data/ai-encryption-key.txt
      # Days the raw WHOOP uploads are kept for re-decoding (whoop_sync.py).
      - WHOOP_RAW_RETENTION_DAYS=30
      # Local day boundary for WHOOP nights and strain.
      - TRAINHUB_TIMEZONE=Europe/Berlin
      # nginx serves page and API together on port 80: `tailscale serve --bg 80` on the host.
      - TRAINHUB_APP_PORT=80
      - TRAINHUB_CLAUDE_HOST=0.0.0.0
      # The container has no tailscale CLI: enter this machine's tailnet address (with :8443 for Claude's apps).
      # - TRAINHUB_REMOTE_URL=https://rechner.tailXXXX.ts.net,https://rechner.tailXXXX.ts.net:8443

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

volumes:
  upload_data:
