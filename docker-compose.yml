version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:////app/data/trainhub.db
      - UPLOAD_FOLDER=/app/uploads
      # Created on first start next to the database; back it up separately from trainhub.db.
      - TRAINHUB_AI_ENCRYPTION_KEY_FILE=/app/data/ai-encryption-key.txt

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

volumes:
  upload_data:
